[project]
name = "rag-core-service"
version = "0.1.0"
description = "RAG processing and embedding worker for DocuMindAI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web Framework & Execution
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.4",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",

    # Event Streaming / Messaging
    "kafka-python-ng>=2.2.2",

    # LLM Orchestration & GenAI Ecosystem
    "langchain>=0.1.0",
    "langchain-community>=0.0.25",
    "langchain-google-genai>=0.0.11",

    # Storage Engines & Database Drivers
    "chromadb>=0.4.24",
    "redis>=5.0.0",
    "psycopg[binary]>=3.1.0",

    # PDF Parsing, RAG Optimization & Math
    "pymupdf>=1.24.0",
    "rank-bm25>=0.2.2",
    "flashrank>=0.2.0",
    "numpy>=1.26.0",
]