# version: '3.8'

services:
  # 1. Relational Database for Document Registry and System Metadata
  postgres:
    image: postgres:15-alpine
    container_name: documind-postgres
    environment:
      POSTGRES_USER: documind_user
      POSTGRES_PASSWORD: documind_password
      POSTGRES_DB: documind_metadata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - documind-network

  pgadmin:
    image: dpage/pgadmin4:8.5
    container_name: documind-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - documind-network

  # 2. Vector Database for Storing Text Chunks and Vector Embeddings
  chromadb:
    image: chromadb/chroma:1.5.9
    container_name: documind-chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/data
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - documind-network

  # 3. In-Memory Cache for Semantic Caching and Rate-Limiting
  redis:
    image: redis:7-alpine
    container_name: documind-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - documind-network

  # ==========================================
  # Apache Kafka (KRaft Mode - Fixed Listeners)
  # ==========================================
  kafka:
    image: apache/kafka:3.7.0
    container_name: documind-kafka
    ports:
      - "9092:9092"  # Host machine access (IntelliJ / Postman / Local Spring Boot)
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - documind-network
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL on 9093 (for Docker containers), EXTERNAL on 9092 (for host/IDE), CONTROLLER on 9094
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9094
      # Advertised: Docker containers talk to 'kafka:9093', Host talks to 'localhost:9092'
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9093,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  # ==========================================
  # Kafka UI (Web Management Dashboard)
  # ==========================================
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: documind-kafka-ui
    ports:
      - "8085:8080"   # Access UI at http://localhost:8085
    networks:
      - documind-network
    environment:
      - KAFKA_CLUSTERS_0_NAME=documind-local-cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9093
    depends_on:
      - kafka

  # 4. Java Spring Boot Enterprise API Gateway
  # gateway-service:
  #   build:
  #     context: ./gateway-service
  #     dockerfile: Dockerfile
  #   container_name: documind-api-gateway
  #   ports:
  #     - "8081:8081"
  #   environment:
  #     # Routes reactive WebClient directly to the FastAPI container name
  #     - RAG_CORE_URL=http://rag-core-service:8080
