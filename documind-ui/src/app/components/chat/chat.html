<div class="flex h-full w-full overflow-auto">
  <section class="w-full border-r border-slate-200 flex flex-col justify-between bg-slate-50/50">
    <div class="p-1 bg-white border-b border-slate-100 flex items-center gap-2 py-2 z-10">
      <div class="font-semibold">
        <!-- Custom Dropdown -->
        <div class="relative">
          <button
            (click)="toggleModelSelectionDropdown()"
            class="w-full border border-slate-200 rounded-lg px-2 py-1 flex items-center gap-2 text-sm bg-white shadow-sm cursor-pointer"
          >
            <span class="material-symbols-outlined"> network_intel_node </span>
            <span>Select Model</span>
            <span class="material-symbols-outlined text-xs"> expand_more </span>
          </button>
          <!-- Dropdown Menu (conditionally shown) -->
          <div
            [class.hidden]="!modelSelectionDropdownOpen"
            class="absolute top-full left-0 mt-1 w-full bg-white border border-slate-200 rounded-lg shadow-lg z-20"
          >
            <button
              class="w-full text-left px-3 py-2 flex items-center gap-2 text-sm hover:bg-slate-50"
            >
              <span class="material-symbols-outlined"> network_intel_node </span>
              <span>Gemini 2.5 Flash</span>
            </button>
            <!-- Add more options here -->
          </div>
        </div>
      </div>
      <span class="text-slate-300">•</span>

      <div class="font-semibold">
        <!-- Custom Dropdown -->
        <div class="relative">
          <button
            (click)="toggleDocumentSelectionDropdown()"
            class="w-full border border-slate-200 rounded-lg px-2 py-1 flex items-center gap-2 text-sm bg-white shadow-sm cursor-pointer"
          >
            <span class="material-symbols-outlined"> article_shortcut </span>
            @if (activeDocName) {
              <span class="truncate" [title]="activeDocName">{{ activeDocName }}</span>
            } @else {
              <span class="truncate" title="Select Document">Select Document</span>
            }
            <span class="material-symbols-outlined text-xs"> expand_more </span>
          </button>
          <!-- Dropdown Menu (conditionally shown) -->
          <div
            [class.hidden]="!documentSelectionDropdownOpen"
            class="absolute top-full left-0 mt-1 w-full bg-white border border-slate-200 rounded-lg shadow-lg z-20"
          >
            <div
              class="w-full flex flex-col text-left px-3 py-2 items-center gap-2 text-sm hover:bg-slate-50"
            >
              @for (doc of completedRoster$ | async; track doc.id) {
                <button
                  (click)="selectDocument(doc.id, doc.name)"
                  class="w-full text-left px-3 py-2 items-center gap-2 text-sm inline-block hover:bg-slate-50 "
                  [class.text-indigo-600]="activeDocId === doc.id"
                >
                  {{ doc.name }}
                </button>
              }
            </div>
            <!-- Add more options here -->
          </div>
        </div>
      </div>
    </div>

    <div class="flex-1 overflow-y-auto p-6 space-y-6 overflow-x-auto">
      @for (msg of conversation$ | async; track $index) {
        @if (msg.sender == 'user') {
          <div class="flex justify-end">
            <div
              class="max-w-[80%] bg-indigo-600 text-white rounded-2xl rounded-tr-none p-4 shadow-md shadow-indigo-100 text-sm leading-relaxed"
            >
              {{ msg.text }}
              <div class="text-right text-[10px] opacity-70 mt-1">{{ msg.time }}</div>
            </div>
          </div>
        }
        @if (msg.sender == 'ai') {
          <div class="flex gap-4 max-w-[90%]">
            <div
              class="h-8 w-8 bg-indigo-100 border border-indigo-200 rounded-lg flex items-center justify-center shrink-0"
            >
              <span class="material-symbols-outlined"> robot </span>
            </div>
            <div class="space-y-3 text-sm pt-1 text-slate-700">
              <p>
                {{ msg.text }}
              </p>
            </div>
            <span class="text-[9px] text-slate-400 mt-1 mr-1 font-medium">{{ msg.time }}</span>
          </div>
        }
      }
    </div>

    <div class="p-4 bg-white border-t border-slate-200">
      <div
        class="relative flex items-center border border-slate-200 rounded-xl bg-slate-50 focus-within:ring-2 focus-within:ring-indigo-500/20 focus-within:border-indigo-500 transition"
      >
        <input
          type="text"
          [(ngModel)]="userQuery"
          (keydown.enter)="sendMessage()"
          placeholder="Type a message..."
          class="w-full bg-transparent py-4 pl-4 pr-12 outline-none text-sm text-slate-800"
        />
        <button
          (click)="sendMessage()"
          [disabled]="!userQuery.trim() || !activeDocId"
          class="absolute right-3 p-2 text-indigo-600 transition disabled:text-slate-400"
        >
          <span class="material-symbols-outlined"> send </span>
        </button>
      </div>
      <div class="text-center text-[10px] text-slate-400 mt-2 tracking-wide">
        Project Alpha RAG • Gemini 2.5 Flash
      </div>
    </div>
  </section>

  
</div>
